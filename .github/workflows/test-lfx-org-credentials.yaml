name: Test LFX Org Credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Verify org-level LFX credentials
        env:
          DEV_CLIENT_ID: ${{ secrets.LFX_DEV_CLIENT_ID }}
          DEV_CLIENT_SECRET: ${{ secrets.LFX_DEV_CLIENT_SECRET }}
          DEV_TOKEN_URL: ${{ vars.LFX_DEV_AUTH0_TOKEN_URL }}
          DEV_V1_AUDIENCE: ${{ vars.LFX_DEV_V1_AUDIENCE }}
          DEV_V2_AUDIENCE: ${{ vars.LFX_DEV_V2_AUDIENCE }}
          PROD_CLIENT_ID: ${{ secrets.LFX_PROD_CLIENT_ID }}
          PROD_CLIENT_SECRET: ${{ secrets.LFX_PROD_CLIENT_SECRET }}
          PROD_TOKEN_URL: https://linuxfoundation.auth0.com/oauth/token
          PROD_V1_AUDIENCE: https://api-gw.platform.linuxfoundation.org/
          PROD_V2_AUDIENCE: https://lfx-api.v2.cluster.lfx.dev/
          PROD_V1_API: https://api-gw.platform.linuxfoundation.org
          PROD_V2_API: https://lfx-api.v2.cluster.lfx.dev
          CNCF_FOUNDATION_ID: a0941000002wBz4AAE
          MAILING_LIST_ID: '116853' # cncf-kepler-maintainers
        run: |
          set -uo pipefail
          response="$(mktemp)"
          rows="$(mktemp)"
          trap 'rm -f "$response" "$rows"' EXIT
          issued_token=""

          # Client IDs are not confidential; the hash identifies the client without being masked.
          fingerprint() {
            [[ -z "$2" ]] || echo "$1 client ID SHA-256: $(printf '%s' "$2" | sha256sum | cut -d ' ' -f 1)"
          }

          # Prints the outcome only, never the token or the client secret.
          exchange() {
            local label="$1" client_id="$2" client_secret="$3" token_url="$4" audience="$5"
            local http_status
            issued_token=""
            if [[ -z "$client_id" || -z "$client_secret" || -z "$token_url" || -z "$audience" ]]; then
              echo "::error::${label}: a required secret or variable is empty."
              return 1
            fi
            if ! http_status="$(jq -n --arg id "$client_id" --arg secret "$client_secret" \
                --arg audience "$audience" \
                '{grant_type: "client_credentials", client_id: $id,
                  client_secret: $secret, audience: $audience}' \
              | curl --silent --show-error --output "$response" --write-out '%{http_code}' \
                  --request POST "$token_url" --header 'content-type: application/json' \
                  --data-binary @-)"; then
              echo "::error::${label}: could not reach the token endpoint."
              return 1
            fi
            if [[ "$http_status" != "200" ]]; then
              echo "::error::${label}: HTTP ${http_status} $(jq -r \
                '[.error, .error_description] | map(strings) | join(": ")' "$response" 2>/dev/null)"
              return 1
            fi
            if ! jq -e '(.access_token | strings | length > 0)
                and ((.token_type // "") | ascii_downcase == "bearer")' "$response" > /dev/null; then
              echo "::error::${label}: the response has no usable bearer token."
              return 1
            fi
            issued_token="$(jq -r '.access_token' "$response")"
            echo "::add-mask::${issued_token}"
            echo "${label}: token issued, expires in $(jq -r '.expires_in' "$response") seconds."
          }

          # GETs into $response; the remaining arguments go to curl.
          get() {
            local label="$1" token="$2" http_status
            shift 2
            if ! http_status="$(curl --silent --show-error --output "$response" \
                --write-out '%{http_code}' --header "Authorization: Bearer ${token}" \
                --header 'Accept: application/json' "$@")"; then
              echo "::error::${label}: could not reach the API."
              return 1
            fi
            if [[ "$http_status" != "200" ]]; then
              echo "::error::${label}: HTTP ${http_status} $(tr -d '\n' < "$response" | head -c 200)"
              return 1
            fi
          }

          # Writes each resource's data to $rows as JSON lines, following page tokens.
          v2_query() {
            local label="$1" type="$2" filter="$3" page_token=""
            : > "$rows"
            for _ in $(seq 1 50); do
              get "$label" "$prod_v2_token" --get "${PROD_V2_API}/query/resources" \
                --data-urlencode 'v=1' --data-urlencode "type=${type}" \
                --data-urlencode 'page_size=100' --data-urlencode "$filter" \
                ${page_token:+--data-urlencode "page_token=${page_token}"} || return 1
              if ! jq -e '.resources | arrays' "$response" > /dev/null; then
                echo "::error::${label}: the response has no resources array."
                return 1
              fi
              jq -c '.resources[].data' "$response" >> "$rows"
              page_token="$(jq -r '.page_token // ""' "$response")"
              [[ -n "$page_token" ]] || return 0
            done
            echo "::error::${label}: stopped after 50 pages."
            return 1
          }

          # The same paged read and filter the calendar script uses.
          check_v1_projects() {
            local label="Prod V1 projects" offset=0 total=0 cncf=0 page page_cncf
            for _ in $(seq 1 500); do
              get "$label" "$prod_v1_token" \
                "${PROD_V1_API}/project-service/v1/projects?offset=${offset}&limit=100" || return 1
              if ! page="$(jq -e '.Data | arrays | length' "$response")"; then
                echo "::error::${label}: the response has no Data array."
                return 1
              fi
              if (( page == 0 )); then
                if (( cncf == 0 )); then
                  echo "::error::${label}: no active CNCF project is visible (${total} projects read)."
                  return 1
                fi
                echo "${label}: ${cncf} active CNCF projects visible (${total} projects read)."
                return 0
              fi
              page_cncf="$(jq --arg id "$CNCF_FOUNDATION_ID" \
                '[.Data[] | select(.Foundation.ID? == $id and .Status == "Active")] | length' "$response")"
              total=$((total + page))
              cncf=$((cncf + page_cncf))
              offset=$((offset + page))
              sleep 0.2
            done
            echo "::error::${label}: stopped after 500 pages."
            return 1
          }

          check_v2_projects() {
            local label="Prod V2 projects" parent_uid count
            v2_query "$label" project 'name=cncf' || return 1
            parent_uid="$(jq -rs '[.[] | select(((.slug // "") | ascii_downcase) == "cncf") | .uid | strings]
              | if length == 1 then .[0] else empty end' "$rows")"
            if [[ -z "$parent_uid" ]]; then
              echo "::error::${label}: expected exactly one project with the slug cncf."
              return 1
            fi
            v2_query "$label" project "parent=project:${parent_uid}" || return 1
            count="$(jq -s 'length' "$rows")"
            if (( count == 0 )); then
              echo "::error::${label}: no CNCF child project is visible."
              return 1
            fi
            echo "${label}: ${count} CNCF child projects visible."
          }

          # Reports the member count only, never names or addresses.
          check_v2_roster() {
            local label="Prod V2 mailing list ${MAILING_LIST_ID}" count
            v2_query "$label" groupsio_member "parent=groupsio_mailing_list:${MAILING_LIST_ID}" || return 1
            count="$(jq -s 'length' "$rows")"
            if (( count == 0 )); then
              echo "::error::${label}: no member is visible."
              return 1
            fi
            echo "${label}: ${count} members visible."
          }

          fingerprint "Dev" "$DEV_CLIENT_ID"
          fingerprint "Prod" "$PROD_CLIENT_ID"

          failed=0
          exchange "Dev V1" "$DEV_CLIENT_ID" "$DEV_CLIENT_SECRET" "$DEV_TOKEN_URL" "$DEV_V1_AUDIENCE" || failed=1
          exchange "Dev V2" "$DEV_CLIENT_ID" "$DEV_CLIENT_SECRET" "$DEV_TOKEN_URL" "$DEV_V2_AUDIENCE" || failed=1
          exchange "Prod V1" "$PROD_CLIENT_ID" "$PROD_CLIENT_SECRET" "$PROD_TOKEN_URL" "$PROD_V1_AUDIENCE" || failed=1
          prod_v1_token="$issued_token"
          exchange "Prod V2" "$PROD_CLIENT_ID" "$PROD_CLIENT_SECRET" "$PROD_TOKEN_URL" "$PROD_V2_AUDIENCE" || failed=1
          prod_v2_token="$issued_token"

          # Read-only API checks, run only with a token that was issued.
          if [[ -n "$prod_v1_token" ]]; then
            check_v1_projects || failed=1
          fi
          if [[ -n "$prod_v2_token" ]]; then
            check_v2_projects || failed=1
            check_v2_roster || failed=1
          fi
          exit "$failed"
